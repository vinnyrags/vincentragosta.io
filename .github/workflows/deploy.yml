name: Deploy

# develop → staging, main → production. Tests run first; a failing test blocks
# the deploy. The deploy itself is the shared deploy-kit reusable workflow: it
# pushes the ref to the droplet's bare repo, whose deploy-kit hook builds,
# purges caches, and smoke-tests (config: /etc/deploy-kit/vincentragosta.conf
# on the droplet). @v2 fails the run unless the droplet reports
# DEPLOY-KIT-RESULT ok/skipped, so a broken build turns the run red.
#
# "Run workflow" re-runs the tests and the push, but deploys nothing when the droplet
# already has the commit: git answers "Everything up-to-date", no hook runs, and the
# run still goes green. To re-deploy a commit, re-run the hook on the droplet (RUNBOOK
# → Deploy).
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency: deploy-${{ github.ref_name }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    uses: vinnyrags/deploy-kit/.github/workflows/deploy-reusable.yml@v2
    with:
      bare_repo: vincentragosta.git
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}

  # itzenzo.tv's real GraphQL queries must still work against the environment just
  # deployed: develop → staging (itzenzo.tv@develop), main → production (itzenzo.tv@main).
  # A failure means the code is live but itzenzo.tv's data contract broke — fix forward or
  # revert. It never skips: a missing ITZENZO_QUERIES_TOKEN fails the job.
  contract:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: itzenzo.tv GraphQL contract
        env:
          ITZENZO_QUERIES_TOKEN: ${{ secrets.ITZENZO_QUERIES_TOKEN }}
          ITZENZO_REF: ${{ github.ref_name == 'main' && 'main' || 'develop' }}
          GRAPHQL_URL: ${{ github.ref_name == 'main' && 'https://vincentragosta.io/wp/graphql' || 'https://staging.vincentragosta.io/wp/graphql' }}
        run: node .github/scripts/graphql-contract.mjs
