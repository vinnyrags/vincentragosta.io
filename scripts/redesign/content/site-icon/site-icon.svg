<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The header's V mark as the site icon: the accent (#d4ff3a) full-bleed
       (platforms round it themselves), the V glyph (path M1 1l7 12 7-12 on a
       16x14 grid) scaled to ~59% of the width so it reads at 16px. -->
  <rect width="512" height="512" fill="#d4ff3a"/>
  <g transform="translate(106 126) scale(18.75)">
    <path d="M1 1l7 12 7-12" fill="none" stroke="#08090a" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
</svg>
